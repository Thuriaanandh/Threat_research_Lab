[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "threat-research-lab"
version = "1.0.0"
description = "A professional, hands-on Threat Research, Hunting, and Detection Engineering Laboratory"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Threat Research Lab Maintainer"}
]
dependencies = [
    "pytest>=7.4.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.0.0",
    "rich>=13.5.0",
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "scapy>=2.5.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v"
