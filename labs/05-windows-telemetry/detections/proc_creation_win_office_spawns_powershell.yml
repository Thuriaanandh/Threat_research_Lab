title: Office Spawning PowerShell
id: 421b6d19-7431-40be-a1c2-19e34b9281a4
status: production
description: Detects Office spawning PowerShell.
author: Threat Research Lab
date: 2026-10-03
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
  selection_child:
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - '-enc'
      - '-w hidden'
  condition: selection_parent and selection_child
level: critical
tags:
  - attack.execution
  - attack.t1059.001
