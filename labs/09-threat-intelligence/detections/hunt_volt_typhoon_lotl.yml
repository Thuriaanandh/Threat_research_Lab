title: Volt Typhoon LOTL Utilities
id: 710928a1-8901-419a-9812-7819ab239102
status: production
description: Detects netsh portproxy or ntdsutil ifm usage.
author: Threat Research Lab
date: 2026-10-03
logsource:
  category: process_creation
  product: windows
detection:
  selection_netsh:
    Image|endswith: '\netsh.exe'
    CommandLine|contains: 'portproxy'
  selection_ntds:
    Image|endswith: '\ntdsutil.exe'
    CommandLine|contains: 'ifm'
  condition: selection_netsh or selection_ntds
level: high
tags:
  - attack.defense_evasion
  - attack.t1090
  - attack.t1003.003
