name: Detection-as-Code Validation

on:
  push:
    paths:
      - 'detections/**'
      - 'labs/**/detections/**'
      - 'scripts/**'
  pull_request:
    paths:
      - 'detections/**'
      - 'labs/**/detections/**'
      - 'scripts/**'

jobs:
  validate-detections:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pydantic rich

      - name: Run Repository & Detection Rule Validator
        run: |
          python scripts/utilities/validate_repo.py
