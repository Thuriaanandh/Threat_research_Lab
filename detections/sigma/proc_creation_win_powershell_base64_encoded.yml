title: PowerShell Base64 Encoded Command Execution
id: c7e1f42a-9214-41e9-9a7f-d8904719602a
status: production
description: Detects the execution of PowerShell with encoded command parameters often utilized to conceal malicious payloads and download cradles.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1027/
author: Threat Research Lab
date: 2026-10-03
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_args:
    CommandLine|contains:
      - ' -e '
      - ' -enc '
      - ' -encodedcommand '
      - ' /e '
      - ' /enc '
      - ' /encodedcommand '
  condition: selection_image and selection_args
falsepositives:
  - Legitimate enterprise deployment scripts (e.g. SCCM, Chocolatey, Intune). Tune by excluding known corporate script paths.
level: medium
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense_evasion
  - attack.t1027
