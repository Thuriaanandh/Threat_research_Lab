title: Microsoft Office Spawning PowerShell Interpreter
id: 28f64243-7f28-4ef6-829d-476722d515a2
status: production
description: Detects Microsoft Office processes (Word, Excel, PowerPoint) spawning PowerShell, a common spearphishing execution mechanism.
references:
  - https://attack.mitre.org/techniques/T1566/001/
  - https://attack.mitre.org/techniques/T1059/001/
author: Threat Research Lab
date: 2026-10-03
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
  selection_child:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Rare legitimate internal macros performing automation (requires administrative review).
level: high
tags:
  - attack.initial_access
  - attack.t1566.001
  - attack.execution
  - attack.t1059.001
